{% extends 'accounts/base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="text-center mb-4 fw-bold text-success">Forgot Password</h3>
      <p class="text-center small text-muted">Enter your email and a new password to reset your account immediately.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">New password</label>
          <input type="password" name="new_password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Confirm new password</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Reset Password</button>
      </form>
      <div class="text-center mt-3 small text-muted">
        <a href="{% url 'login' %}">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
