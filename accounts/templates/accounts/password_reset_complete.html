{% extends 'accounts/base.html' %}
{% block title %}Password Updated{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 text-center">
      <h3 class="mb-3 fw-bold text-success">Password updated</h3>
      <p class="text-muted">Your password has been changed successfully. Please log in with your new password.</p>
      <a href="{% url 'login' %}" class="btn btn-primary mt-3">Log In</a>
    </div>
  </div>
</div>
{% endblock %}
