{% extends 'accounts/base.html' %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 text-center">
      <h3 class="mb-3 fw-bold text-success">Check your email</h3>
      <p class="text-muted">If an account exists for that email address, we have sent a secure password reset link. The link will expire for your protection.</p>
      <a href="{% url 'login' %}" class="btn btn-primary mt-3">Return to Login</a>
    </div>
  </div>
</div>
{% endblock %}
