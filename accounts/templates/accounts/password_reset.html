{% extends 'accounts/base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="text-center mb-3 fw-bold text-success">Reset your password</h3>
      <p class="text-center small text-muted mb-4">Enter your account email and we will send you a secure password reset link.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.email.errors }}
        <label class="form-label fw-semibold" for="id_email">Email address</label>
        {{ form.email }}
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-3">Send Reset Link</button>
      </form>
      <div class="text-center mt-3 small text-muted">
        <a href="{% url 'login' %}">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
